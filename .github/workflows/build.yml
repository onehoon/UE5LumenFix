# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "refactor/asi", "refactor/IntelReflexFix", "refactor/IntelReflexFix-dllmain-asi" ]
    
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      working-directory: ${{ github.workspace }}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{env.BUILD_PLATFORM}} ${{env.SOLUTION_FILE_PATH}}
      
    - uses: actions/upload-artifact@v7
      with:
        name: d3d12-proxy
        path: ${{ github.workspace }}\x64\Release\*.dll
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      with:
        name: UE5LumenFix-ASI
        path: ${{ github.workspace }}\x64\Release\UE5LumenFix.asi
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      with:
        name: IntelReflexFix-ASI
        path: ${{ github.workspace }}\x64\Release\IntelReflexFix.asi
        if-no-files-found: error
